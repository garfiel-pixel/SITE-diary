<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Masterbuilders Site Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout concept: a duplicate site-diary book. Navy form print on cool paper, the yellow carbon sheet showing behind it, and tape-measure sliders as the signature control. */
  :root {
    --ground: #d9dfe8;
    --paper: #f7f8fa;
    --field: #ffffff;
    --ink: #13213d;
    --ink-soft: #4b5a78;
    --rule: #c5cddb;
    --line: #13213d;
    --carbon: #f3d83a;
    --on-carbon: #1f1800;
    --tint: rgba(243, 216, 58, 0.38);
    --danger: #a8261d;
    --focus: #1f5fe0;
    --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0b1019;
      --paper: #151c2a;
      --field: #1b2437;
      --ink: #e8edf7;
      --ink-soft: #9aa9c7;
      --rule: #2b3650;
      --line: #5a6a92;
      --tint: rgba(243, 216, 58, 0.22);
      --danger: #ff8a80;
      --focus: #ffe066;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0b1019;
    --paper: #151c2a;
    --field: #1b2437;
    --ink: #e8edf7;
    --ink-soft: #9aa9c7;
    --rule: #2b3650;
    --line: #5a6a92;
    --tint: rgba(243, 216, 58, 0.22);
    --danger: #ff8a80;
    --focus: #ffe066;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.4 var(--f-body);
    padding-block: 22px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .cap { font: 600 14px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; }

  /* sheet */
  .sheet {
    max-width: 960px;
    margin-inline: auto;
    background: var(--paper);
    border: 1.5px solid var(--line);
    box-shadow: 7px 7px 0 var(--carbon);
    padding: clamp(14px, 3vw, 26px);
    display: grid;
    gap: 16px;
    min-width: 0;
  }
  .title { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 14px; text-align: center; text-wrap: balance; text-transform: uppercase; }
  .brand { font: 700 clamp(28px, 6vw, 40px)/1 var(--f-display); letter-spacing: 0.08em; }
  .sep { font: 500 clamp(24px, 5vw, 32px)/1 var(--f-display); color: var(--ink-soft); }
  .doc { font: 500 clamp(28px, 6vw, 40px)/1 var(--f-display); letter-spacing: 0.08em; }

  .banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; background: var(--tint); border: 1.5px dashed var(--line); font-size: 15px; }
  .banner p { margin: 0; flex: 1 1 260px; }

  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--line); background: var(--field); }
  .cell { padding: 10px 12px; display: grid; gap: 6px; border-left: 1.5px solid var(--line); min-width: 0; }
  .cell:first-child { border-left: 0; }
  .cell .big { display: flex; align-items: baseline; gap: 6px; font: 600 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .cell .unit { font: 500 14px/1 var(--f-body); color: var(--ink-soft); }

  /* grids */
  .g { display: grid; gap: 16px; min-width: 0; }
  .g-id { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .g-dw { grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); }
  .g2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 780px) {
    .g-id, .g-dw, .g2 { grid-template-columns: minmax(0, 1fr); }
    .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cell:nth-child(3) { border-left: 0; }
    .cell:nth-child(n+3) { border-top: 1.5px solid var(--line); }
  }

  /* panels, printed-form style */
  .panel { border: 1.5px solid var(--line); background: var(--paper); min-width: 0; display: flex; flex-direction: column; }
  .panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 12px; border-bottom: 1.5px solid var(--line); }
  .ph-left { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; min-width: 0; }
  .ph-title { margin: 0; font: 600 17px/1.1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; }
  .ph-col { font: 600 14px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .panel-b { padding: 0; flex: 1; }
  .pad { padding: 12px; }
  .tag { font: 500 14px/1.2 var(--f-body); border: 0; border-bottom: 1.5px dashed var(--line); background: transparent; color: var(--ink-soft); width: 150px; max-width: 100%; padding: 2px 0; }

  .txt { width: 100%; height: 54px; border: 0; background: var(--field); padding: 0 12px; font: 600 21px/1.2 var(--f-body); color: var(--ink); border-radius: 0; }
  .txt::placeholder { color: var(--ink-soft); font-weight: 400; }

  .day { font: 700 clamp(40px, 7vw, 54px)/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 12px 4px; }
  .day-note { padding: 0 12px 10px; color: var(--ink-soft); font-size: 14px; }
  .date-row { display: flex; gap: 6px; align-items: center; padding: 0 12px 12px; flex-wrap: wrap; }
  .date { flex: 1 1 150px; min-width: 0; height: 44px; border: 1.5px solid var(--line); background: var(--field); padding: 0 10px; font: 600 17px/1 var(--f-mono); }
  .sq { width: 44px; height: 44px; border: 1.5px solid var(--line); background: var(--field); font-size: 22px; line-height: 1; }
  .sq:hover, .btn:hover { background: var(--tint); }
  .sq:active, .btn:active { background: var(--carbon); color: var(--on-carbon); }
  .btn { height: 44px; padding: 0 14px; border: 1.5px solid var(--line); background: var(--field); font-weight: 600; }

  /* weather */
  .wx-group { padding: 10px 12px 4px; }
  .wx-group + .wx-group { padding-bottom: 12px; padding-top: 6px; }
  .wx-label { font: 600 15px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; color: var(--ink-soft); }
  .wx-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 560px) { .wx-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .wx, .rc { position: relative; display: block; min-width: 0; }
  .wx-chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 66px; padding: 6px 4px; border: 1.5px solid var(--rule); background: var(--field); color: var(--ink-soft); font: 500 13px/1.15 var(--f-body); text-align: center; cursor: pointer; }
  .wx-chip svg { display: block; }
  .rc-chip { display: flex; align-items: center; min-height: 42px; padding: 0 12px; border: 1.5px solid var(--rule); background: var(--field); color: var(--ink); font-weight: 500; font-size: 15px; cursor: pointer; }
  .wx:hover .wx-chip, .rc:hover .rc-chip { border-color: var(--line); }
  .wx input:checked + .wx-chip, .rc input:checked + .rc-chip { background: var(--carbon); color: var(--on-carbon); border-color: var(--line); font-weight: 600; }
  .wx input:focus-visible + .wx-chip, .rc input:focus-visible + .rc-chip { outline: 3px solid var(--focus); outline-offset: 2px; }
  .rc-grid { display: flex; flex-wrap: wrap; gap: 6px; }

  .loss-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; padding: 12px; align-items: start; }
  @media (max-width: 780px) { .loss-body { grid-template-columns: minmax(0, 1fr); } }
  .sub { margin: 0 0 8px; font: 600 15px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }

  /* rows */
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); }
  .row-top { display: flex; align-items: center; gap: 10px; }
  .row-name { flex: 1; min-width: 0; font: 600 17px/1.2 var(--f-body); overflow-wrap: anywhere; }
  .name-in { flex: 1; min-width: 0; height: 40px; border: 0; border-bottom: 1.5px dashed var(--line); background: transparent; font: 600 17px/1.2 var(--f-body); }
  .row-ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
  .empty { padding: 16px 12px; color: var(--ink-soft); border-bottom: 1px solid var(--rule); }
  .x { width: 36px; height: 36px; flex: none; border: 0; background: transparent; color: var(--ink-soft); font-size: 24px; line-height: 1; }
  .x:hover { color: var(--danger); background: var(--tint); }
  .flash { animation: flash 0.9s ease-out; }
  @keyframes flash { from { background: var(--tint); } to { background: transparent; } }

  .stepper { display: inline-flex; align-items: stretch; border: 1.5px solid var(--line); background: var(--field); flex: none; }
  .stp { width: 42px; height: 42px; border: 0; background: transparent; font: 600 22px/1 var(--f-body); }
  .stp.sm { width: 40px; font-size: 14px; }
  .stp:hover { background: var(--tint); }
  .stp:active { background: var(--carbon); color: var(--on-carbon); }
  .stp:disabled, .num:disabled { opacity: 0.4; cursor: not-allowed; }
  .num { width: 58px; height: 42px; border: 0; border-inline: 1.5px solid var(--line); background: transparent; text-align: center; font: 600 20px/1 var(--f-mono); font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; border-radius: 0; padding: 0; }
  .num.wide { width: 76px; }
  .num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit-sel { height: 44px; border: 1.5px solid var(--line); background: var(--field); padding: 0 10px; font-weight: 500; border-radius: 0; }

  /* tape-measure slider */
  .ruler { position: relative; height: 40px; margin-top: 6px; --pct: 0; }
  .ticks { position: absolute; left: 9px; right: 9px; bottom: 0; height: 21px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .ticks::before { content: ''; position: absolute; left: -9px; right: -9px; bottom: 0; height: 5px; background: var(--rule); }
  .tk { display: block; width: 1px; height: 8px; margin-bottom: 5px; background: var(--ink-soft); position: relative; }
  .tk.maj { width: 1.5px; height: 16px; background: var(--ink); }
  .fill { position: absolute; left: 9px; bottom: 0; height: 5px; width: calc(var(--pct) * (100% - 18px)); background: var(--carbon); box-shadow: 0 0 0 1px var(--line); pointer-events: none; }
  .ruler input[type=range] { position: absolute; inset: 0; width: 100%; height: 40px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: grab; touch-action: pan-y; }
  .ruler input[type=range]:active { cursor: grabbing; }
  .ruler input[type=range]::-webkit-slider-runnable-track { height: 40px; background: transparent; }
  .ruler input[type=range]::-moz-range-track { height: 40px; background: transparent; }
  .ruler input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 32px; margin-top: 4px; border-radius: 3px;
    border: 2px solid var(--ink); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    background: linear-gradient(var(--on-carbon), var(--on-carbon)) 50% 50% / 2px 14px no-repeat, var(--carbon);
  }
  .ruler input[type=range]::-moz-range-thumb {
    width: 14px; height: 28px; border-radius: 3px; border: 2px solid var(--ink); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    background: linear-gradient(var(--on-carbon), var(--on-carbon)) 50% 50% / 2px 14px no-repeat, var(--carbon);
  }
  .ruler input[type=range]:focus-visible { outline: none; }
  .ruler input[type=range]:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ruler input[type=range]:focus-visible::-moz-range-thumb { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ruler.off { opacity: 0.4; }
  .ruler.off input[type=range] { cursor: not-allowed; }

  /* quick-add chips */
  .palette-wrap { padding: 10px 12px 12px; border-top: 1.5px solid var(--line); background: var(--field); }
  .pal-l { margin: 0 0 8px; font: 600 14px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 38px; padding: 0 11px; border: 1.5px solid var(--rule); background: var(--paper); font-weight: 500; font-size: 15px; border-radius: 3px; }
  .chip:hover { border-color: var(--line); background: var(--tint); }
  .chip:active { transform: translateY(1px); background: var(--carbon); color: var(--on-carbon); }
  .chip.on { background: var(--tint); border-color: var(--line); }
  .chip.ghost { border-style: dashed; }

  /* lined writing areas */
  .lined { display: block; width: 100%; border: 0; resize: none; overflow: hidden; background-color: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px); background-attachment: local; font: 17px/32px var(--f-body); padding: 0 12px; border-radius: 0; }
  .lined::placeholder { color: var(--ink-soft); }

  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; color: var(--ink-soft); font-size: 14px; }
  .btn.armed { background: var(--danger); color: var(--paper); border-color: var(--danger); }

  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } .chip:active { transform: none; } }
</style>

<script>
(function () {
  'use strict';

  }

  /* ---------- catalogues ---------- */
  var EQUIPMENT = [

    { name: 'Concrete mixer', def: { h: 6 } }, { name: 'Compactor', def: { h: 4 } }, { name: 'Crane', def: { h: 8 } },

    { name: 'PVC pipe', def: { q: 20, u: 'lengths' } }, { name: 'Paint', def: { q: 5, u: 'gal' } }
  ];
  var UNITS = ['bags', 'loads', 'pcs', 'lengths', 'm³', 'tonnes', 'gal', 'rolls', 'kg'];
  var TRADES = ['Supervisor', 'Mason', 'Steel fixer', 'Carpenter', 'Labourer', 'Electrician', 'Plumber', 'Painter', 'Welder', 'Machine operator', 'Roofer', 'Tiler', 'Driver'].map(function (n) { return { name: n }; });

  var CLOUD = 'M10 22a5 5 0 0 1-.5-9.98 7 7 0 0 1 13.2 1.5A4.2 4.2 0 0 1 22.5 22H10z';

    { k: 'partly', t: 'Partly cloudy', p: '<circle cx="11" cy="11" r="3.8"/><path d="M11 3.5v1.8M3.5 11h1.8M5.7 5.7L7 7M16.3 5.7L15 7"/><g transform="translate(3 3)"><path d="' + CLOUD + '"/></g>' },
    { k: 'overcast', t: 'Overcast', p: '<g transform="translate(0 2)"><path d="' + CLOUD + '"/></g>' },
    { k: 'showers', t: 'Showers', p: '<g transform="translate(0 -4)"><path d="' + CLOUD + '"/></g><path d="M12 23l-1.5 4M20 23l-1.5 4"/>' },

    { k: 'storm', t: 'Storm', p: '<g transform="translate(0 -5)"><path d="' + CLOUD + '"/></g><path d="M17.5 18.5l-4.5 6h4l-2 5 6-7.5h-4l2.5-3.5z"/>' }
  ];
  var LOSS = [
    { k: 'none', t: 'No time lost' }, { k: 'rain', t: 'Rain' }, { k: 'equipment', t: 'Equipment breakdown' },
    { k: 'materials', t: 'Materials late' }, { k: 'utilities', t: 'Power or water cut' }, { k: 'access', t: 'Site access' }, { k: 'other', t: 'Other' }
  ];

  /* ---------- state ---------- */
  function blank() {
    return { v: 1, sample: false, project: '', site: '', date: ymd(new Date()), wxAm: null, wxPm: null, loss: 'none', lossH: 0,

    s.materials = [{ id: uid(), name: 'Cement', qty: 50, unit: 'bags' }, { id: uid(), name: 'Blocks 6"', qty: 500, unit: 'pcs' }, { id: uid(), name: 'Sand', qty: 2, unit: 'loads' }];

  function load() {

  var saveT, savedEl = null, sumEls = {}, sizers = [];
  function touch() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      var ok = true;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { ok = false; }
      if (savedEl) {
        var d = new Date();
        savedEl.textContent = ok ? 'Saved on this device at ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : 'This browser is blocking storage, so changes are not being saved.';
      }
    }, 250);
  }
  function sync() {
    if (!sumEls.people) return;
    sumEls.people.textContent = sum(S.crewA, 'n') + sum(S.crewB, 'n');
    sumEls.equip.textContent = fmt(sum(S.equipment, 'hours'));
    sumEls.deliv.textContent = S.materials.length;
    sumEls.lost.textContent = fmt(Number(S.lossH) || 0);
  }

  /* ---------- controls ---------- */
  function makeSlider(o) {
    var min = o.min, max = o.max, step = o.step;
    var steps = Math.round((max - min) / step), every = Math.max(1, Math.round(o.major / step));
    var dec = h('button', { class: 'stp', type: 'button', 'aria-label': 'Decrease ' + o.label }, '−');
    var inc = h('button', { class: 'stp', type: 'button', 'aria-label': 'Increase ' + o.label }, '+');
    var num = h('input', { class: 'num', type: 'number', inputmode: 'decimal', min: min, max: max, step: step, 'aria-label': o.label });
    var stepper = h('div', { class: 'stepper' }, dec, num, inc);
    var range = h('input', { type: 'range', min: min, max: max, step: step, 'aria-label': o.label });
    var ticks = h('div', { class: 'ticks', 'aria-hidden': 'true' });
    for (var i = 0; i <= steps; i++) ticks.append(h('span', { class: 'tk' + (i % every === 0 ? ' maj' : '') }));
    var fill = h('div', { class: 'fill', 'aria-hidden': 'true' });
    var ruler = h('div', { class: 'ruler' }, ticks, fill, range);
    var cur = min;
    function set(v, user) {
      v = Number(v);
      if (!isFinite(v)) return;
      v = clamp(Math.round((v - min) / step) * step + min, min, max);
      v = Math.round(v * 100) / 100;
      cur = v; range.value = v; num.value = fmt(v);
      ruler.style.setProperty('--pct', (v - min) / (max - min));
      if (user) o.onChange(v);
    }
    range.addEventListener('input', function () { set(range.value, true); });
    num.addEventListener('change', function () { set(num.value === '' ? cur : num.value, true); });
    dec.addEventListener('click', function () { set(cur - step, true); });
    inc.addEventListener('click', function () { set(cur + step, true); });
    function disable(b) {
      [range, num, dec, inc].forEach(function (x) { x.disabled = b; });
      ruler.classList.toggle('off', b);
    }
    set(o.value, false);
    return { stepper: stepper, ruler: ruler, set: set, disable: disable };
  }

  function makeQty(o) {
    var num = h('input', { class: 'num wide', type: 'number', inputmode: 'numeric', min: 0, max: 99999, step: 1, 'aria-label': o.label });
    var cur = 0;
    function set(v, user) {
      v = Math.round(Number(v));
      if (!isFinite(v)) return;
      v = clamp(v, 0, 99999); cur = v; num.value = v;
      if (user) o.onChange(v);
    }
    function b(t, d) {
      return h('button', { class: 'stp sm', type: 'button', 'aria-label': (d < 0 ? 'Decrease ' : 'Increase ') + o.label + ' by ' + Math.abs(d), onclick: function () { set(cur + d, true); } }, t);
    }
    num.addEventListener('change', function () { set(num.value === '' ? cur : num.value, true); });
    set(o.value, false);
    return h('div', { class: 'stepper' }, b('−10', -10), b('−', -1), num, b('+', 1), b('+10', 10));
  }

  /* ---------- panels ---------- */
  function panel(title, col, body, extra) {
    return h('section', { class: 'panel' },
      h('div', { class: 'panel-h' }, h('div', { class: 'ph-left' }, h('h2', { class: 'ph-title' }, title), extra), col ? h('span', { class: 'ph-col' }, col) : null),
      h('div', { class: 'panel-b' }, body));
  }

  function buildList(c) {
    var kind = c.kind, key = c.key, flashId = null;
    var list = h('ul', { class: 'rows' });
    var pal = h('div', { class: 'palette' });

    function newItem(e) {
      var d = e.def || {}, id = uid();
      if (kind === 'hours') return { id: id, name: e.name, hours: d.h != null ? d.h : 8 };
      if (kind === 'count') return { id: id, name: e.name, n: 1 };
      return { id: id, name: e.name, qty: d.q != null ? d.q : 1, unit: d.u || 'pcs' };
    }
    function addEntry(entry) {
      var arr = S[key];
      if (entry) {
        var ex = arr.find(function (r) { return !r.custom && r.name === entry.name; });
        if (ex) { if (kind === 'count') ex.n = Math.min(60, ex.n + 1); flashId = ex.id; }
        else { var it = newItem(entry); arr.push(it); flashId = it.id; }
      } else {
        var cu = newItem({ name: '' }); cu.custom = true; arr.push(cu); flashId = cu.id;
      }
      var id = flashId;
      draw(); sync(); touch();
      var li = list.querySelector('[data-id="' + id + '"]');
      if (li) { var ni = li.querySelector('.name-in'); if (ni) ni.focus(); else li.scrollIntoView({ block: 'nearest' }); }
    }
    function rowEl(it) {
      var li = h('li', { class: 'row' + (it.id === flashId ? ' flash' : ''), 'data-id': it.id });
      var nameEl;
      if (it.custom) {
        nameEl = h('input', { class: 'name-in', type: 'text', placeholder: c.customPh, 'aria-label': c.customPh, value: it.name });
        nameEl.addEventListener('input', function () { it.name = nameEl.value; touch(); });
      } else nameEl = h('span', { class: 'row-name' }, it.name);
      var rm = h('button', { class: 'x', type: 'button', 'aria-label': 'Remove ' + (it.name || 'this row'), onclick: function () {
        S[key] = S[key].filter(function (r) { return r.id !== it.id; }); draw(); sync(); touch();
      } }, '×');
      if (kind === 'qty') {
        var q = makeQty({ value: it.qty, label: (it.name || 'Item') + ' quantity', onChange: function (v) { it.qty = v; touch(); } });
        var sel = h('select', { class: 'unit-sel', 'aria-label': 'Unit' }, UNITS.map(function (u) { return h('option', { value: u }, u); }));
        sel.value = it.unit;
        sel.addEventListener('change', function () { it.unit = sel.value; touch(); });
        li.append(h('div', { class: 'row-top' }, nameEl, rm), h('div', { class: 'row-ctl' }, q, sel));
      } else {
        var s = makeSlider({ min: 0, max: c.max, step: c.step, major: c.major, value: kind === 'hours' ? it.hours : it.n,
          label: (it.name || 'Row') + ' ' + c.col.toLowerCase(),
          onChange: function (v) { if (kind === 'hours') it.hours = v; else it.n = v; sync(); touch(); } });
        li.append(h('div', { class: 'row-top' }, nameEl, s.stepper, rm), s.ruler);
      }
      return li;
    }
    function draw() {
      var rows = S[key].length ? S[key].map(rowEl) : [h('li', { class: 'empty' }, c.empty)];
      list.replaceChildren.apply(list, rows);
      pal.querySelectorAll('.chip[data-name]').forEach(function (b) {
        b.classList.toggle('on', S[key].some(function (r) { return !r.custom && r.name === b.dataset.name; }));
      });
      flashId = null;
    }
    c.catalog.forEach(function (e) {
      var b = h('button', { class: 'chip', type: 'button', onclick: function () { addEntry(e); } }, '+ ' + e.name);
      b.dataset.name = e.name; pal.append(b);
    });
    pal.append(h('button', { class: 'chip ghost', type: 'button', onclick: function () { addEntry(null); } }, '+ Other'));

    var tag = null;
    if (c.tagKey) {
      tag = h('input', { class: 'tag', type: 'text', placeholder: 'Group name', 'aria-label': c.title + ' group name', value: S[c.tagKey] });
      tag.addEventListener('input', function () { S[c.tagKey] = tag.value; touch(); });
    }
    var body = h('div', null, list, h('div', { class: 'palette-wrap' }, h('p', { class: 'pal-l' }, c.hint), pal));
    draw();
    return panel(c.title, c.col, body, tag);
  }

  function textPanel(c) {
    var ta = h('textarea', { class: 'lined', rows: 1, 'aria-label': c.title, placeholder: c.ph, spellcheck: 'true' });
    ta.value = S[c.key];
    function size() {
      ta.style.height = 'auto';
      ta.style.height = Math.max(c.min, Math.ceil(ta.scrollHeight / 32)) * 32 + 'px';
    }
    sizers.push(size);
    ta.addEventListener('input', function () { S[c.key] = ta.value; size(); touch(); });
    function addLine(t) {
      var v = ta.value;
      ta.value = v + (v && !v.endsWith('\n') ? '\n' : '') + t;
      S[c.key] = ta.value; size(); touch();
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    }
    var pal = h('div', { class: 'palette' }, c.chips.map(function (ch) {
      return h('button', { class: 'chip', type: 'button', onclick: function () { addLine(typeof ch.text === 'function' ? ch.text() : ch.text); } }, '+ ' + ch.label);
    }));
    return panel(c.title, null, h('div', null,
      h('div', { class: 'palette-wrap', style: 'border-top:0;border-bottom:1.5px solid var(--line)' }, h('p', { class: 'pal-l' }, c.hint), pal), ta));
  }

  function weatherPanel() {
    function group(label, key) {
      var grid = h('div', { class: 'wx-grid' });
      WX.forEach(function (o) {
        var inp = h('input', { class: 'sr', type: 'radio', name: 'wx-' + key, value: o.k });
        inp.checked = S[key] === o.k;
        inp.addEventListener('change', function () { S[key] = o.k; touch(); });
        grid.append(h('label', { class: 'wx' }, inp, h('span', { class: 'wx-chip' },
          h('span', { html: '<svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + o.p + '</svg>' }),
          h('span', null, o.t))));
      });
      return h('div', { class: 'wx-group', role: 'radiogroup', 'aria-label': 'Weather ' + label }, h('div', { class: 'wx-label' }, label), grid);
    }
    return panel('Weather', null, h('div', null, group('A.M.', 'wxAm'), group('P.M.', 'wxPm')));
  }

  function datePanel() {
    var dayEl = h('div', { class: 'day' });
    var dateIn = h('input', { class: 'date', type: 'date', 'aria-label': 'Date', value: S.date });
    function paint() { dayEl.textContent = parseYmd(S.date).toLocaleDateString('en-US', { weekday: 'long' }); dateIn.value = S.date; }
    function setDate(s) { if (!s) return; S.date = s; paint(); touch(); }
    function shift(n) { var d = parseYmd(S.date); d.setDate(d.getDate() + n); setDate(ymd(d)); }
    dateIn.addEventListener('change', function () { setDate(dateIn.value); });
    paint();
    return panel('Day / Date', null, h('div', null, dayEl, h('div', { class: 'day-note' }, 'Filled in from the date'),
      h('div', { class: 'date-row' },
        h('button', { class: 'sq', type: 'button', 'aria-label': 'Previous day', onclick: function () { shift(-1); } }, '‹'),
        dateIn,
        h('button', { class: 'sq', type: 'button', 'aria-label': 'Next day', onclick: function () { shift(1); } }, '›'),
        h('button', { class: 'btn', type: 'button', onclick: function () { setDate(ymd(new Date())); } }, 'Today'))));
  }

  function lossPanel() {
    var sl = makeSlider({ min: 0, max: 10, step: 0.5, major: 1, value: S.lossH, label: 'Hours lost',
      onChange: function (v) { S.lossH = v; sync(); touch(); } });
    sl.disable(S.loss === 'none');
    var grid = h('div', { class: 'rc-grid', role: 'radiogroup', 'aria-label': 'Reason for time lost' });
    LOSS.forEach(function (o) {
      var inp = h('input', { class: 'sr', type: 'radio', name: 'loss', value: o.k });
      inp.checked = S.loss === o.k;
      inp.addEventListener('change', function () {
        S.loss = o.k;
        if (o.k === 'none') { S.lossH = 0; sl.set(0, false); }
        else if (!S.lossH) { S.lossH = 1; sl.set(1, false); }
        sl.disable(o.k === 'none'); sync(); touch();
      });
      grid.append(h('label', { class: 'rc' }, inp, h('span', { class: 'rc-chip' }, o.t)));
    });
    var body = h('div', { class: 'loss-body' },
      h('div', null, h('p', { class: 'sub' }, 'Reason'), grid),
      h('div', null, h('div', { class: 'row-top' }, h('p', { class: 'sub', style: 'flex:1;margin:0' }, 'Slide to set hours'), sl.stepper), sl.ruler));
    return panel('Time lost', 'Hours', body);
  }

  /* ---------- page ---------- */
  var app = document.getElementById('app');

  function field(title, key, ph) {
    var inp = h('input', { class: 'txt', type: 'text', placeholder: ph, 'aria-label': title, value: S[key], autocomplete: 'off' });
    inp.addEventListener('input', function () { S[key] = inp.value; touch(); });
    return panel(title, null, inp);
  }
  function stamp() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' '; }

  function startBlank() { S = blank(); touch(); build(); window.scrollTo(0, 0); }

  function build() {
    sizers = []; sumEls = {};
    var sheet = h('main', { class: 'sheet' });

    sheet.append(h('header', null, h('h1', { class: 'title' },
      h('span', { class: 'brand' }, 'Masterbuilders'), h('span', { class: 'sep', 'aria-hidden': 'true' }, '—'), h('span', { class: 'doc' }, 'Site Diary'))));

    if (S.sample) {
      sheet.append(h('div', { class: 'banner' },
        h('p', null, 'This is a sample entry so you can try every control. Everything on it can be changed.'),
        h('button', { class: 'btn', type: 'button', onclick: startBlank }, 'Start blank page')));
    }

    function cell(label, id, unit) {
      var v = h('span', null, '0'); sumEls[id] = v;
      return h('div', { class: 'cell' }, h('div', { class: 'cap' }, label), h('div', { class: 'big' }, v, h('span', { class: 'unit' }, unit)));
    }
    sheet.append(h('div', { class: 'summary', role: 'group', 'aria-label': 'Totals for today' },
      cell('On site', 'people', 'people'), cell('Equipment', 'equip', 'hours'), cell('Deliveries', 'deliv', 'items'), cell('Time lost', 'lost', 'hours')));

    sheet.append(h('div', { class: 'g g-id' }, field('Project', 'project', 'Project name'), field('Site', 'site', 'Site')));
    sheet.append(h('div', { class: 'g g-dw' }, datePanel(), weatherPanel()));
    sheet.append(lossPanel());

    sheet.append(h('div', { class: 'g g2' },
      buildList({ kind: 'hours', key: 'equipment', title: 'Equipment', col: 'Hours', catalog: EQUIPMENT, max: 12, step: 0.5, major: 1,
        empty: 'No equipment on site yet.', hint: 'Tap to add', customPh: 'Equipment name' }),
      buildList({ kind: 'qty', key: 'materials', title: 'Materials delivered', col: 'Qty.', catalog: MATERIALS,
        empty: 'No deliveries yet.', hint: 'Tap to add', customPh: 'Material name' })));

    sheet.append(h('div', { class: 'g g2' },
      buildList({ kind: 'count', key: 'crewA', title: 'Workforce', col: 'No.', tagKey: 'tagA', catalog: TRADES, max: 60, step: 1, major: 10,
        empty: 'Nobody signed in yet.', hint: 'Tap a trade to add, tap again to add one more', customPh: 'Trade or role' }),
      buildList({ kind: 'count', key: 'crewB', title: 'Workforce', col: 'No.', tagKey: 'tagB', catalog: TRADES, max: 60, step: 1, major: 10,
        empty: 'Nobody signed in yet.', hint: 'Tap a trade to add, tap again to add one more', customPh: 'Trade or role' })));

    sheet.append(textPanel({ title: 'Work in progress', key: 'wip', min: 8, ph: 'Tap a job above or just write here',
      hint: 'Tap to start a line',
      chips: ['Excavation', 'Blockwork', 'Rebar fixing', 'Formwork', 'Concrete pour', 'Roofing', 'Plastering', 'Electrical', 'Plumbing', 'Tiling', 'Painting', 'Clean-up']
        .map(function (n) { return { label: n, text: n + ': ' }; }) }));
    sheet.append(textPanel({ title: 'Visitors', key: 'visitors', min: 3, ph: 'Who came by',
      hint: 'Tap to log a visit with the time',
      chips: ['Client', 'Architect', 'Engineer', 'Inspector', 'Supplier', 'Subcontractor'].map(function (n) { return { label: n, text: function () { return stamp() + n + ' - '; } }; }) }));
    sheet.append(textPanel({ title: 'Instructions', key: 'instr', min: 5, ph: 'Instructions received on site',
      hint: 'Tap to start a line',
      chips: ['Client', 'Architect', 'Engineer', 'Verbal', 'Variation', 'Safety'].map(function (n) { return { label: n, text: n + ': ' }; }) }));

    savedEl = h('span', null, 'Changes save on this device as you go.');
    var clear = h('button', { class: 'btn', type: 'button' }, 'Clear page');
    var armed = false, tm;
    function disarm() { armed = false; clear.textContent = 'Clear page'; clear.classList.remove('armed'); }
    clear.addEventListener('click', function () {
      if (!armed) { armed = true; clear.textContent = 'Tap again to clear the page'; clear.classList.add('armed'); tm = setTimeout(disarm, 3500); }
      else { clearTimeout(tm); startBlank(); }
    });
    sheet.append(h('footer', { class: 'foot' }, savedEl, clear));

    app.replaceChildren(sheet);
    sync();
    var run = function () { sizers.forEach(function (f) { f(); }); };
    requestAnimationFrame(run);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
  }

  window.addEventListener('resize', function () { sizers.forEach(function (f) { f(); }); });
  build();
})();
</script>

</body></html>
